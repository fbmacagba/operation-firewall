[workspace]
members = [
    "crates/ofw-adapter-codex",
    "crates/ofw-audit",
    "crates/ofw-cli",
    "crates/ofw-contracts",
    "crates/ofw-core",
    "crates/ofw-intent",
    "crates/ofw-policy",
    "crates/ofw-resolve",
]
# `fuzz/` is its own project: libfuzzer-sys needs nightly, and the pin above is
# a deliberate reproducibility property that must not be weakened to enable
# fuzzing. Seeds it finds are replayed on this toolchain by
# crates/ofw-cli/tests/fuzz_regression.rs.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/fbmacagba/operation-firewall"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
