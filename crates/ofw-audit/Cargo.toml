[package]
name = "ofw-audit"
description = "Redacted audit event construction for Operation Firewall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ofw-contracts = { path = "../ofw-contracts" }
# Reviewed in docs/decisions/0004-vetted-serialization-and-digest-dependencies.md.
# `default-features = false` drops `oid`, which carries ASN.1 object-identifier
# metadata this project has no use for.
sha2 = { version = "0.11.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true
