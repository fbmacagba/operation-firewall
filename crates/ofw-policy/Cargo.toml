[package]
name = "ofw-policy"
description = "Deterministic monotonic restriction policy for Operation Firewall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ofw-contracts = { path = "../ofw-contracts" }
# Reviewed in docs/decisions/0004-vetted-serialization-and-digest-dependencies.md.
# `unbounded_depth` stays off: policy bundles are untrusted input and the
# default 128-level recursion limit is the stack-exhaustion guard.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true
