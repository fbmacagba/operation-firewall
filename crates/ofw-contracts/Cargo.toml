[package]
name = "ofw-contracts"
description = "Validated domain primitives for Operation Firewall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Reviewed in docs/decisions/0004-vetted-serialization-and-digest-dependencies.md
# before this file was modified. `derive` only: `rc` and `unstable` stay off.
serde = { version = "1.0.229", features = ["derive"] }
# Same crate and same review as `ofw-audit`'s use of it; moving `Digest` here
# relocates an already-reviewed dependency rather than adding a new one.
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
# Test-only: reads the normative schemas so a wire-vocabulary drift fails the
# build rather than being discovered by a rule that quietly stops matching.
serde_json = "1.0.151"

[lints]
workspace = true
