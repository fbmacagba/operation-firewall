# Deterministic verification gate for Operation Firewall.
#
# This runs the same command a developer runs locally (`scripts/verify.py`),
# which covers contract-schema validation, rustfmt, Clippy with warnings
# denied, and the workspace test suite. Keeping CI to that one entry point
# means the local gate and the remote gate cannot drift apart.
#
# Actions are pinned to immutable commit identities, per
# docs/superpowers/specs/2026-08-01-milestone-1-completion-design.md
# ("GitHub Actions uses immutable commit identities for actions").
#
# Scope note: a green run is evidence for the checks named above on the
# platforms in the matrix. It is not evidence of production enforcement, and
# Milestone 1 artifacts remain development artifacts.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Resolver behaviour is platform-specific by design; one platform
      # failing must not mask the state of the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the development-time contract validator
        # Pinned: this validates the normative JSON Schema contracts, so its
        # behaviour is part of the gate rather than incidental tooling.
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml pins the channel and components; installing it in
        # an explicit step keeps toolchain-resolution failures out of the
        # verification step's log.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Record the resolved toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          python --version

      - name: Run the verification suite
        run: python -B scripts/verify.py

  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Blocking as of 2026-08-08. It started advisory on purpose: a surviving
    # mutant is not automatically a defect, and failing the build on the first
    # run would have meant triaging a wall of unreviewed output under pressure
    # to make it green, which is how a gate gets weakened rather than satisfied.
    #
    # That triage has now happened -- all 46 survivors killed, none excluded or
    # suppressed, see docs/milestone-1/mutation-triage.md -- and a run at zero
    # survivors is what makes blocking meaningful rather than punitive.
    #
    # Two things had to change together, and the second is the one that was
    # actually load-bearing. `continue-on-error` meant a failure did not fail
    # the workflow; `|| true` on the command meant there was no failure to
    # propagate in the first place. Removing only the first would have produced
    # a job that looks blocking and cannot fail, which is worse than an honest
    # advisory one.
    #
    # If a future change strands a survivor, the fix is a test that kills it.
    # `.cargo/mutants.toml` does not exist and adding an exclusion to make this
    # green is the one repair that is not available.

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install cargo-mutants
        # Pinned like every other tool here: an unpinned install makes the job
        # a moving target and its output incomparable between runs.
        #
        # 27.1.0 is the current release, checked against crates.io rather than
        # recalled. The first version considered, 25.0.1, does exist but dates
        # from April 2025 and predates this workspace's edition-2024 and 1.97
        # toolchain -- an old pin here would fail for reasons that look like
        # defects in the code under test.
        #
        # Like the cargo-audit pin, this has a floor as well as a ceiling:
        # do not lower it to "be safe".
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: Mutate the decision core
        # Scoped to the crates where a surviving mutant means a missing
        # security assertion, which as of 2026-08-08 is six of the eight.
        #
        # The scope used to be four, on the reasoning that the remaining crates
        # are I/O plumbing whose mutants are dominated by unobservable output
        # differences. That was never measured, and the audit-gate defect fixed
        # in ed1f957 lived in one of the excluded crates. Measuring it (see
        # docs/milestone-1/mutation-triage.md) showed the reasoning never
        # applied to ofw-contracts or ofw-audit at all: they are the contract
        # types and the audit trail, not plumbing, and they held 56 survivors
        # including the digest the revalidation fingerprint is built from and
        # the rule deciding when an exclusive lock may be broken. Those are
        # killed and both crates are in scope.
        #
        # ofw-cli and ofw-adapter-codex stay out with 112 unread survivors
        # between them. That is a number rather than an assumption now, and
        # reading it is the next widening -- not a claim that they are clean.
        #
        # `--no-shuffle` keeps the order stable so two runs are comparable.
        #
        # The exit status is held and re-raised at the end rather than allowed
        # to abort the step, so the report is printed even when the job fails --
        # a failing gate that does not say what failed sends the next reader to
        # the artifact when the answer could have been in the log.
        #
        # `cargo mutants` exits 0 only when every viable mutant was caught, 2
        # when some survived, 3 on a test timeout and 4 when the baseline was
        # already failing (mutants.rs/exit-codes.html, read rather than
        # recalled). Re-raising the status therefore blocks on all four, which
        # is right: a timeout and an unrunnable baseline are both "this run
        # measured nothing", and a gate must not pass on that.
        run: |
          set +e
          cargo mutants --no-shuffle --timeout 120 \
            --package ofw-core \
            --package ofw-policy \
            --package ofw-intent \
            --package ofw-resolve \
            --package ofw-contracts \
            --package ofw-audit \
            --output mutants-report
          status=$?
          set -e

          echo "::group::mutation outcome"
          echo "--- missed ---"
          cat mutants-report/mutants.out/missed.txt 2>/dev/null || echo "none recorded"
          echo "--- timeout ---"
          cat mutants-report/mutants.out/timeout.txt 2>/dev/null || echo "none recorded"
          echo "::endgroup::"

          exit "$status"

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report
          path: mutants-report/
          if-no-files-found: warn

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-audit
        # `--locked` so the tool's own dependency graph is the one its authors
        # published, not whatever resolves today.
        #
        # The version pin has a floor as well as a ceiling: 0.21.2 cannot parse
        # CVSS 4.0 severities, which the RustSec database now contains, and it
        # fails the whole scan rather than skipping the advisory it cannot read.
        # That is the right failure mode -- a scanner that silently skipped
        # entries it did not understand would report a clean run over a
        # database it had only partly read -- but it means the pin must be
        # revisited when the advisory format moves, not merely held steady.
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Scan for advisories
        # The runtime is a security boundary; a known-vulnerable dependency in
        # it is a failure, not a note. `--deny warnings` also fails on
        # unmaintained and yanked crates.
        run: cargo audit --deny warnings

      - name: Review licences and generate the SBOM
        # Fails closed on any licence expression outside the reviewed
        # allowlist, including a package with no licence field at all.
        run: python -B scripts/supply-chain.py --sbom sbom.cyclonedx.json

      - name: Confirm the SBOM is reproducible
        # It is a pure function of Cargo.lock -- no timestamp, no serial
        # number -- so a second run over the same commit must be byte
        # identical. An SBOM that changes without the lockfile changing cannot
        # be used as evidence of what shipped.
        run: |
          python -B scripts/supply-chain.py --sbom sbom.second.json
          diff sbom.cyclonedx.json sbom.second.json

      - name: Confirm the release binary rebuilds identically
        # Scope this carefully, because "reproducible build" is a claim people
        # read as stronger than what is checked here. This checks *rebuild
        # determinism*: the same source, same toolchain, same path, same
        # machine, built twice, produces the same bytes. It catches a build
        # that embeds a timestamp, a random seed, or iteration order that
        # varies between runs.
        #
        # It is NOT the full reproducibility property. That requires the same
        # bytes from a different absolute path and a different machine, which
        # needs path remapping and a controlled environment. Recorded as a gap
        # in docs/milestone-1/completion-status.md rather than implied away by
        # a green check named "reproducible".
        run: |
          cargo build --release -p ofw-cli --locked
          first=$(sha256sum target/release/ofw | cut -d' ' -f1)
          rm -f target/release/ofw
          cargo build --release -p ofw-cli --locked
          second=$(sha256sum target/release/ofw | cut -d' ' -f1)
          echo "first  $first"
          echo "second $second"
          test "$first" = "$second"
          echo "$first  ofw" > release-digest.txt

      - name: Publish the SBOM and release digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            sbom.cyclonedx.json
            release-digest.txt
          if-no-files-found: error

  fuzz:
    name: fuzz (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Nightly is scoped to this job alone. The workspace stays pinned to
    # 1.97.1 everywhere else, because the pin is a reproducibility property of
    # the shipped artifact and libFuzzer's nightly requirement must not be
    # allowed to erode it. `fuzz/` is excluded from the workspace for the same
    # reason.
    #
    # Seeds found here are committed to tests/fuzz-corpus/ and replayed by the
    # stable suite, so a crash found once stays checked without nightly.

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install the nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup run nightly rustc --version

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.1

      - name: Fuzz every untrusted parser
        # Bounded so the job is a gate rather than a background process:
        # each target gets a fixed time budget and a memory ceiling, and any
        # crash fails the job. Extended campaigns belong on a schedule.
        #
        # The target list is read from `cargo fuzz list` rather than written
        # out here. It used to be written out, and this step's name has been a
        # lie since the apply-patch target was added minutes before this
        # change: a fourth untrusted parser existed, had a target, and was
        # never fuzzed, because the loop still named three.
        #
        # That is the same failure this repository has already recorded twice
        # -- a list kept somewhere the gate cannot see it drifts silently, and
        # the drift reads as coverage. Deriving it means adding a target is
        # enough to have it fuzzed, and the count assertion below means an
        # empty or truncated list fails loudly rather than passing quickly.
        run: |
          targets=$(cargo +nightly fuzz list --fuzz-dir fuzz)
          echo "targets: $targets"
          count=$(echo "$targets" | grep -c .)
          if [ "$count" -lt 4 ]; then
            echo "::error::expected at least 4 fuzz targets, found $count"
            exit 1
          fi
          for target in $targets; do
            echo "::group::fuzz $target"
            cargo +nightly fuzz run "$target" \
              --fuzz-dir fuzz \
              -- -max_total_time=120 -rss_limit_mb=2048 -max_len=65536
            echo "::endgroup::"
          done

      - name: Publish any crash artifacts
        # Only runs when the step above failed. A crashing input is the most
        # valuable output this job can produce and must not be lost with the
        # runner.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
