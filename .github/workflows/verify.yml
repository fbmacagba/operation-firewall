# Deterministic verification gate for Operation Firewall.
#
# This runs the same command a developer runs locally (`scripts/verify.py`),
# which covers contract-schema validation, rustfmt, Clippy with warnings
# denied, and the workspace test suite. Keeping CI to that one entry point
# means the local gate and the remote gate cannot drift apart.
#
# Actions are pinned to immutable commit identities, per
# docs/superpowers/specs/2026-08-01-milestone-1-completion-design.md
# ("GitHub Actions uses immutable commit identities for actions").
#
# Scope note: a green run is evidence for the checks named above on the
# platforms in the matrix. It is not evidence of production enforcement, and
# Milestone 1 artifacts remain development artifacts.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Resolver behaviour is platform-specific by design; one platform
      # failing must not mask the state of the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the development-time contract validator
        # Pinned: this validates the normative JSON Schema contracts, so its
        # behaviour is part of the gate rather than incidental tooling.
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml pins the channel and components; installing it in
        # an explicit step keeps toolchain-resolution failures out of the
        # verification step's log.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Record the resolved toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          python --version

      - name: Run the verification suite
        run: python -B scripts/verify.py

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-audit
        # `--locked` so the tool's own dependency graph is the one its authors
        # published, not whatever resolves today.
        run: cargo install cargo-audit --locked --version 0.21.2

      - name: Scan for advisories
        # The runtime is a security boundary; a known-vulnerable dependency in
        # it is a failure, not a note. `--deny warnings` also fails on
        # unmaintained and yanked crates.
        run: cargo audit --deny warnings

      - name: Review licences and generate the SBOM
        # Fails closed on any licence expression outside the reviewed
        # allowlist, including a package with no licence field at all.
        run: python -B scripts/supply-chain.py --sbom sbom.cyclonedx.json

      - name: Confirm the SBOM is reproducible
        # It is a pure function of Cargo.lock -- no timestamp, no serial
        # number -- so a second run over the same commit must be byte
        # identical. An SBOM that changes without the lockfile changing cannot
        # be used as evidence of what shipped.
        run: |
          python -B scripts/supply-chain.py --sbom sbom.second.json
          diff sbom.cyclonedx.json sbom.second.json

      - name: Publish the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cyclonedx.json
          if-no-files-found: error
